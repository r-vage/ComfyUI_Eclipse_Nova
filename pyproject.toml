[project]
name = "ComfyUI_Eclipse_Nova"
description = "ComfyUI prompt, pipe and media tools redesigned from Eclipse with compact panels and a focus on canvas performance in classic canvas and Nodes 2.0."
version = "1.0.25"
license = {file = "LICENSE"}
dependencies = [
    "torch",
    "numpy",
    "Pillow",
    "opencv-python",
    "pilgram",
    "safetensors>=0.4,<0.9",
    "torchvision",
    "PyYAML",
    "aiohttp",
    "color-matcher>=0.6,<0.7",
    "kornia>=0.7.1",
    "spandrel>=0.4",
    "SoundCard>=0.4.6,<0.5",
    "stable-ts==2.19.1",
    "faster-whisper>=1.2.1,<2",
    "fonttools>=4.0,<5",
]

[project.optional-dependencies]
detailer = [
    "torch>=2.6",
    "ultralytics>=8.3,<9",
    "SAM-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
    "transformers>=4.47,<6",
    "pymatting>=1.1.12,<2",
]

[project.urls]
Repository = "https://github.com/r-vage/ComfyUI_Eclipse_Nova"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "rvage"
DisplayName = "ComfyUI Eclipse Nova"
Icon = "https://raw.githubusercontent.com/r-vage/ComfyUI_Eclipse_Nova/refs/heads/main/Readme/icon_eclipse.png"
